# train_ppo_v5.yaml with gSDE noise resampled every 30 steps instead of every 4.
#
# phase1_v6 charged changes in the steering and throttle commands. Noise drawn every 4 steps
# changes the command on a quarter of all steps whatever the policy means to do, so the
# charge taxed exploration itself: in v6 it cost 0.029 a step against 0.019 of explore pay.
# The policies hid from it by pinning both actuators at a limit, where tanh flattens the
# noise away, and held full steering lock: v6 orbited 27 % of the time at 1M, phase1_v6r 75 %.
# Resampled once a second, the noise changes a command on 1 step in 30.

env_config: configs/env_phase1.yaml
n_envs: 10
total_timesteps: 20000000
seed: 0
device: cpu

policy: MlpPolicy
net_arch: [256, 256]

n_steps: 1024           # x 10 workers = 10240 samples
batch_size: 2048
n_epochs: 10
learning_rate: 3.0e-4
gamma: 0.995            # ~6.7 s horizon at 30 Hz
gae_lambda: 0.95
clip_range: 0.2
target_kl: 0.03
ent_coef: 0.005         # v4's 0.0 let the steering mean saturate tanh
vf_coef: 0.5
max_grad_norm: 0.5

use_sde: true
sde_sample_freq: 30     # new noise every 30 steps (1 s); v5 and v6 used 4
squash_output: true
log_std_init: -2.0      # gSDE scale: the noise matrix std, not the action std

normalize_reward: true

eval_every_steps: 500000
eval_episodes: 20
video_every_steps: 2000000
video_episodes: 2
checkpoint_every_steps: 500000
run_dir: runs
