# phase1_v4 / phase1_mem_v1: v3's PPO with actions squashed into bounds instead of clipped.
#
# phase1_v3a/v3b fixed v2's collapse and overshot the other way. Actions were Gaussian
# samples clipped to [-1, 1] by the env, so extra std cost nothing, and ent_coef 0.01 ran
# the std from 1.1 to 3.1 (throttle 4.0) by 3.5M. The deterministic steering mean sat
# near |5|, 93 % of sampled steering clipped, and both runs were back to circling at 98 %
# steering lock. v2's ent_coef 0.004 collapsed and v3's 0.01 exploded: with clipping there
# is no stable value to find.
#
# Squashed gSDE bounds every action with tanh, so a wide distribution stops being free,
# and its exploration noise is held for sde_sample_freq steps instead of redrawn every step.
#
# phase1_v4 (env_phase1.yaml) and phase1_mem_v1 (env_phase1_memory.yaml on the memory-ring
# branch) run side by side, 10 workers each, and differ only in the obstacle memory.

env_config: configs/env_phase1.yaml
n_envs: 10
total_timesteps: 20000000
seed: 0
device: cpu

policy: MlpPolicy
net_arch: [256, 256]

n_steps: 1024           # x 10 workers = 10240 samples
batch_size: 2048
n_epochs: 10
learning_rate: 3.0e-4
gamma: 0.995            # ~6.7 s horizon at 30 Hz
gae_lambda: 0.95
clip_range: 0.2
target_kl: 0.03
ent_coef: 0.0           # the tanh bound, not an entropy bonus, keeps exploration from collapsing to a point
vf_coef: 0.5
max_grad_norm: 0.5

use_sde: true
sde_sample_freq: 4      # new noise every 4 steps (0.13 s)
squash_output: true
log_std_init: -2.0      # gSDE scale: the noise matrix std, not the action std

normalize_reward: true

eval_every_steps: 500000
eval_episodes: 20
video_every_steps: 2000000
video_episodes: 2
checkpoint_every_steps: 500000
run_dir: runs
