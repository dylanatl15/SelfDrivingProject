# train_ppo_v6.yaml with a penalty on pre-tanh action means past 1.5, where tanh gives 0.91.
#
# Every gen7 run held its pre-tanh throttle mean at +2 to +3.6, even with a wall under 1 m
# ahead. There every noise sample squashes to the same near-full throttle, so exploration
# tried braking on only 8 % (phase1_v7) to 16 % (phase1_mem_v4) of those steps, and PPO had
# no advantage signal to learn it. Forward crashes came at full steering lock and near-full
# throttle, though the car stops from 1.3 m/s in under 0.35 m. The entropy bonus cannot
# pull the mean back, only grow the noise; see src/selfdrive/train/policies.py.

env_config: configs/env_phase1.yaml
n_envs: 10
total_timesteps: 20000000
seed: 0
device: cpu

policy: MlpPolicy
net_arch: [256, 256]

n_steps: 1024           # x 10 workers = 10240 samples
batch_size: 2048
n_epochs: 10
learning_rate: 3.0e-4
gamma: 0.995            # ~6.7 s horizon at 30 Hz
gae_lambda: 0.95
clip_range: 0.2
target_kl: 0.03
ent_coef: 0.005         # v4's 0.0 let the steering mean saturate tanh
vf_coef: 0.5
max_grad_norm: 0.5

use_sde: true
sde_sample_freq: 30     # new noise every 30 steps (1 s); v5 and v6 used 4
squash_output: true
log_std_init: -2.0      # gSDE scale: the noise matrix std, not the action std
mean_penalty: 0.05      # per unit^2 of pre-tanh mean past the margin, summed over actions
mean_margin: 1.5        # tanh(1.5) = 0.91

normalize_reward: true

eval_every_steps: 500000
eval_episodes: 20
video_every_steps: 2000000
video_episodes: 2
checkpoint_every_steps: 500000
run_dir: runs
