# phase1_v3a / phase1_v3b: v2's PPO settings with smaller updates and exploration kept up.
#
# phase1_v2 (train_ppo.yaml) collapsed its action std from 0.96 to 0.06 by ~3M steps. Once
# the policy was that deterministic, 20 minibatches x 10 epochs per rollout moved it far
# past the clip range (approx_kl 0.37, 60 % of samples clipped by 11M), and eval return
# fell from -16 at 3.5M to between -40 and -58 by 9.5-11M while it drifted.
#
# v3a and v3b run side by side and differ only in env config, so each gets half the
# workers and twice the rollout length: the buffer stays 10240 samples, as in v2.

env_config: configs/env_phase1.yaml
n_envs: 10
total_timesteps: 20000000
seed: 0
device: cpu

policy: MlpPolicy
net_arch: [256, 256]

n_steps: 1024           # x 10 workers = 10240 samples, the same buffer as v2
batch_size: 2048        # 5 minibatches per epoch instead of v2's 20
n_epochs: 10
learning_rate: 3.0e-4
gamma: 0.995            # ~6.7 s horizon at 30 Hz
gae_lambda: 0.95
clip_range: 0.2
target_kl: 0.03         # end an update's epochs early once the policy has moved this far
ent_coef: 0.01          # v2's 0.004 let the action std collapse to 0.06
vf_coef: 0.5
max_grad_norm: 0.5

normalize_reward: true

eval_every_steps: 500000
eval_episodes: 20
video_every_steps: 2000000
video_episodes: 2
checkpoint_every_steps: 500000
run_dir: runs
