# Single source of truth for the public sponsor page (sponsor.dylantamayo.dev).
#
# Edit this file, re-run `python -m selfdrive.web.sponsor`, rebuild the container.
# Git history of this file is the audit trail: who offered what, when.
#
# `state` is the TRUE state and is for the team. The page shows only three of them:
#
#   needed / asked / declined / no_reply  ->  "Still needed"   (public, indistinguishable)
#   pledged                              ->  "Pledged"        (public, with `by`)
#   received                             ->  "Received"       (public, with `by`)
#   covered                              ->  listed under "Already covered", never as an ask
#
# Never publish a declined or ignored vendor. `asked`, `declined` and `no_reply` all read as
# "still needed" on the page, so the team can track cold asks here without naming anyone.
#
# Prices are quoted from the vendor's own store on the date in `meta.prices_checked`.
# `verified: false` marks a figure nobody has checked. Do not quote one in an email.
#
# EVERY OPTION MUST BE ONE WE WOULD ACTUALLY ACCEPT AND USE. An option we would turn down
# is not generosity, it is a trap: a vendor ships it, we cannot use it, and we have wasted
# their money and their goodwill. Parts ruled out during the design are recorded in
# docs/hardware-bom.md with the reason, so nobody re-adds them here by accident.

meta:
  title: Self-Driving Scale Car
  tagline: A 1/10-scale car that teaches itself to drive, and the parts list that would let us build it.
  prices_checked: 2026-09-29
  # Both addresses go in the To: field of every button on the page. The university address
  # is the one outreach email is sent from, so it is the one a vendor will recognise; the
  # personal one is the one that is read on a phone at 9pm.
  contact:
    - dylan.tamayo01@utrgv.edu
    - contact.dylantamayo@gmail.com
  repo: https://github.com/dylanatl15/SelfDrivingProject
  portfolio: https://dylantamayo.dev
  bom: https://github.com/dylanatl15/SelfDrivingProject/blob/main/docs/hardware-bom.md
  course: Senior capstone project, BS Computer Science
  deadline: First week of December 2026

# Short, checkable claims. Numbers only, no adjectives.
status:
  - Simulator and reinforcement-learning stack are built, tested and public - 414 unit tests.
  - Policies train on 20 parallel workers and are scored on 100 held-out arenas they never saw.
  - Best policy reaches 2.3 waypoints per 50 s run on unseen arenas and covers 19.1 m² of new ground.
  - It still crashes on 17 % of those held-out runs. That number is going down and we publish it.
  - What does not exist yet is the car. Every line below is a part we do not have.

groups:
  - name: Sensing
    blurb: >-
      The car has to measure distance, not guess it. The simulator already models a forward
      depth arc plus four short-range rangefinders, so anything listed here drops into a
      configuration file rather than into a redesign.
    items:
      - part: Depth camera
        qty: 1
        why: >-
          The main sensor, and the single part that would change this project the most. Today a
          phone infers depth from its own motion, which fails exactly when the car stops - which
          is the moment it has to decide whether to reverse. A depth camera measures instead of
          inferring, and it keeps measuring when the car is standing still.
        spec: >-
          Roughly 60-125 degrees horizontal field of view, depth out to about 4 m, USB to a
          Raspberry Pi. Running the network on the camera is a bonus, not a requirement.
        note: >-
          We looked hard at a 360-degree laser scanner and at the cheap time-of-flight camera
          modules, and ruled both out before writing this page. A scanner has to sit above the
          chassis to clear its own body, and from up there it only sees obstacles taller than the
          car - most of what we have to avoid is lower. The small ToF modules are lower resolution
          and shorter range than the phone we already own, so they would be a step backwards. If
          you have either on a shelf, please keep it for a project it suits better than ours.
        state: needed
        options:
          - name: Luxonis OAK-D S2
            price: $329
            url: https://shop.luxonis.com/collections/oak-cameras-1
            note: >-
              Our first choice. Its 69-degree field of view is very close to what every policy we
              have trained already expects, and it runs the network on the camera, which means the
              computer below can be the small one.
          - name: Intel RealSense D435i
            price: $334
            url: https://store.intelrealsense.com/buy-intel-realsense-depth-camera-d435i.html
            note: >-
              Equally good for us, and its built-in motion sensor covers the orientation line below
              on its own, so it quietly removes another part from this list.
          - name: Orbbec Gemini 335
            price: $264
            url: https://store.orbbec.com/products/gemini-335
            note: Same active-stereo approach for less. We would be glad to have it.
          - name: Luxonis OAK-D Lite
            price: $269
            url: https://shop.luxonis.com/collections/oak-cameras-1
            note: The lighter, cheaper OAK. Still runs the network on-camera, which is the part we care about.

      - part: Short-range rangefinders
        qty: 4
        why: >-
          They cover the corners the camera cannot see, and they keep working when it is pointed
          the other way. Four exactly - the serial protocol our firmware is already written
          against has four fields for them, so four of any technology keeps that work intact.
        spec: Range to 2 m or more, 10 Hz or faster, I2C or a trigger/echo pair.
        note: >-
          If nobody has these, it is not a blocker: the two-dollar ultrasonic sensors our simulator
          already models are adequate and we can buy those ourselves. We are asking for the laser
          version because four ultrasonics fired close together interfere with each other, and
          losing that problem before the first real drive would save us a week.
        state: needed
        options:
          - name: Adafruit VL53L1X time-of-flight breakout
            price: $14.95 each
            url: https://www.adafruit.com/product/3967
            note: Laser, 4 m, no cross-talk between units. Four of these is the whole ask.
          - name: Pololu VL53L1X carrier
            price: $22.95 each
            url: https://www.pololu.com/product/3415
            note: The same sensor with its own voltage regulator, which makes it the more forgiving one to wire.

      - part: Orientation sensor
        qty: 1
        why: >-
          The car remembers where obstacles were for three seconds after they leave view, and it
          has to know how far it has turned to place those memories correctly. A phone does this
          job today; a computer on the car cannot.
        spec: 9-axis, with the orientation worked out on the chip so the computer does no filtering.
        note: >-
          Worth knowing before you offer one: if the depth camera that arrives has a motion sensor
          built in, this line disappears entirely and we will say so here.
        state: needed
        options:
          - name: Adafruit BNO085 9-DOF IMU
            price: $29.50
            url: https://www.adafruit.com/product/4754
            note: Does the sensor fusion on-chip and reports orientation directly, which is the whole reason to pick it.

      # Phase 2 of three. Not needed for the December demo, needed for the finished project.
      - part: GPS receiver
        qty: 1
        why: Phase 2 of the project drives the car to map pins dropped outdoors.
        spec: Serial NMEA output is enough for what we have planned.
        state: needed
        options:
          - name: SparkFun u-blox NEO-M9N
            price: $70.95
            url: https://www.sparkfun.com/sparkfun-gps-breakout-neo-m9n-u-fl-qwiic.html
            note: Everything Phase 2 needs as it is currently designed.
          - name: SparkFun ZED-F9P RTK
            price: $259.95
            url: https://www.sparkfun.com/sparkfun-gps-rtk-sma-breakout-zed-f9p-qwiic.html
            note: >-
              A bigger ask, and an honest one. Centimetre-accurate positioning would let the car
              follow a path rather than wander toward a pin, which changes what we can demonstrate
              in December. We would not be disappointed by the one above.

  - name: Computing
    blurb: >-
      One small computer to run the trained network and talk to the motor controller, and one
      microcontroller to own everything electrical. The split is deliberate: changing a motor
      then never means retraining the network.
    items:
      - part: Single-board computer
        qty: 1
        why: Runs the trained network and bridges the camera to the microcontroller.
        spec: A Raspberry Pi 5. 8 GB is the comfortable choice; 4 GB genuinely does the job.
        note: >-
          This is the line the 2026 memory shortage hit hardest. A Pi 5 16 GB was $120 at launch
          and is $305 today, because the memory is being bought up by AI datacentres. It is the
          main reason we are asking rather than quietly buying. Worth saying plainly: the network
          we run is small - 120 numbers in, two layers - and a Pi 5 computes it in well under a
          millisecond, so we are not asking anyone for an AI accelerator we do not need.
        state: needed
        options:
          - name: Raspberry Pi 5, 8 GB
            price: $175
            url: https://www.pishop.us/product/raspberry-pi-5-8gb/
            note: The one we would choose, with room for the logging this project generates.
          - name: Raspberry Pi 5, 4 GB
            price: $110
            url: https://www.pishop.us/product/raspberry-pi-5-4gb/
            note: Enough for the car as designed, and $65 kinder to whoever sends it.

      - part: Microcontroller board
        qty: 2
        why: >-
          Owns the motor, the servo and the rangefinders, and cuts power to the motor if it stops
          hearing from the computer for 200 ms. Two, because in a year of testing one of them is
          going to die.
        spec: ESP32-S3 with native USB, so it appears as a clean serial device with no bridge chip.
        state: needed
        options:
          - name: Espressif ESP32-S3-DevKitC-1-N8R8
            price: $15
            url: https://www.mouser.com/en/ProductDetail/Espressif-Systems/ESP32-S3-DevKitC-1-N8R8
            note: The reference board, and what the firmware is being written against.
          - name: Adafruit ESP32-S3 DevKitC
            price: $19.95
            url: https://www.adafruit.com/product/5364
            note: Same chip, and easy to add to an order if you are already sending something else from here.

      - part: Cooling, power supply and storage for the computer
        qty: 1
        why: >-
          A Pi 5 slows itself down without a fan, and a memory card will not survive the amount of
          logging this project does.
        spec: Active cooler, 27 W USB-C supply, and an SSD with the adapter to mount it.
        note: The least interesting line on this page, and the one that stops the car running for a month.
        state: needed
        options:
          - name: Active cooler + 27 W supply + NVMe adapter + SSD
            price: ~$75 for the set
            verified: false
            note: Any combination that adds up to those four things is welcome - brand does not matter here.

  - name: Chassis and drive
    blurb: >-
      A 1/10-scale car that steers with a servo at the front and drives from the rear, which is
      the geometry the simulator models. One mechanical detail here matters more than it sounds.
    items:
      - part: 1/10-scale steering chassis
        qty: 1
        why: The car itself. Front-wheel steering, rear-wheel drive, roughly 40 cm long.
        spec: >-
          Wheelbase near 0.25 m, length near 0.40 m, width near 0.20 m. Close is fine - we
          re-measure whatever arrives and retrain against the real numbers.
        state: needed
        options:
          - name: Hiwonder Ackermann metal chassis
            price: $49.99
            url: https://www.hiwonder.com/products/ackermann-steering-chassis
            note: >-
              Our first choice and the best value on this page by a wide margin. It arrives with
              encoder motors and the steering servo already in the box, which covers the next two
              lines as well.
          - name: Tamiya TT-02R 4x4 chassis kit
            price: $157.50
            url: https://www.towerhobbies.com/product/110-tt-02r-4x4-chassis-kit/TAM47326.html
            note: A true 1/10 kit. We would assemble it ourselves, which we would rather enjoy.
          - name: Traxxas Slash 4X4 VXL
            price: $429.95
            url: https://traxxas.com/slash-4x4-vxl-68386-4
            note: >-
              The platform MIT's RACECAR and the F1TENTH racing series are built on, so it would be
              a pleasure to work with. In fairness we should say we would swap its speed controller
              for one that behaves at walking pace - the reason is under "Drive motor and speed
              controller" below.

      - part: Steering servo
        qty: 1
        why: Turns the front wheels. The simulator models how fast a real servo can move, so the real one has to keep up.
        spec: At least 28 degrees each way, at least 200 degrees per second. Most hobby servos beat that threefold.
        note: If the Hiwonder chassis above arrives, this line disappears - its servo is included.
        state: needed
        options:
          - name: Savox SC-1251MG
            price: $69-81
            url: https://www.whiterosehobbies.com/products/savox-1251mg-low-profile-servo-09-125-at-6-0v
            note: 9 kg-cm and about 667 degrees per second, with metal gears that will outlast our mistakes.
          - name: Power HD 1501MG
            price: ~$20
            verified: false
            note: A quarter of the price and still comfortably past what we need. No reluctance here at all.

      - part: Drive motor and speed controller
        qty: 1
        why: Drives the rear wheels.
        spec: >-
          Brushed, or sensored brushless. This is the one non-obvious requirement on the page: the
          policy tops out at 1.5 m/s, which is a crawl by hobby standards, and sensorless brushless
          motors stutter and cog down there. A sensored motor also reports its own wheel speed,
          which our safety layer reads on every single control step.
        note: If the Hiwonder chassis above arrives, this line disappears too - it ships with encoder motors.
        state: needed
        options:
          - name: Hobbywing QuicRun 10BL120 G2 sensored combo, motor included
            price: $99.99
            url: https://www.amainhobbies.com/hobbywing-quicrun-10bl120-g2-sensored-brushless-esc-combo-w-3650-sl-g2-motor-hwa38020381/p1564886
            note: Our first choice - sensored, so the wheel-speed feedback arrives free, and the motor comes with it.
          - name: Hobbywing QuicRun 1060 brushed controller
            price: $23.99
            url: https://www.hobbywingdirect.com/products/quicrun-10-brushed-esc
            note: Smooth at low speed, which is all we actually require. Pairs with any 27-turn brushed motor.

  - name: Power and safety
    blurb: >-
      A battery-powered car that drives itself needs a way for a person to stop it. That is not
      optional, and it is written into our test procedure before the first real drive.
    items:
      - part: Battery packs and a charger
        qty: 3 packs, 1 charger
        why: Three packs, so an afternoon of testing does not stop to recharge.
        spec: 2S 5000 mAh hard-case packs, and a balance charger that handles them.
        state: needed
        options:
          - name: Gens Ace 2S 5000 mAh hard-case
            price: $40-53 each
            url: https://www.buddyrc.com/collections/gens-ace-batteries
            note: Hard-case, which matters on a car whose whole purpose is to learn from crashes.
          - name: SkyRC B6Neo balance charger
            price: $35
            url: https://www.amazon.com/clp/B0CCT2WGNS
            note: One charger covers all three packs.

      - part: 5 V regulator, 5 A
        qty: 1
        why: >-
          The computer cannot share the motor controller's small supply - one hard turn of the
          steering browns it out and reboots the computer mid-drive. The two need separate rails.
        spec: 5 V at 5 A continuous from a 2S pack.
        state: needed
        options:
          - name: Pololu D24V50F5
            price: $32.95
            url: https://www.pololu.com/product/2851
            note: Comfortably over-rated for the load, which is the point.

      - part: Radio transmitter, receiver and a hard kill switch
        qty: 1
        why: A human override that does not depend on any of the software above working correctly.
        spec: Any 6-channel hobby radio, plus a switch that physically opens the motor circuit.
        note: >-
          If you only send one thing from this page, we would genuinely rather it were this than
          the camera. It is the cheapest part here and the only one that is a safety requirement.
        state: needed
        options:
          - name: FlySky FS-i6X with iA6B receiver
            price: $53-70
            url: https://www.hobbytown.com/flysky-i6x-6channel-afhds-2a-air-radio-system-w-ia6b-receiver-fsy-i6xia6b/p1674181
            note: The usual student choice, and enough channels for the override plus a spare.
          - name: High-current slide switch
            price: ~$8
            verified: false
            note: Anything rated well past the motor's stall current. A physical switch, not a relay.

  - name: Phase 3, a stretch ask
    blurb: >-
      The final phase puts the camera on a head that can look around. The servo has to report the
      angle it is actually at, because that angle becomes part of what the network sees - and an
      ordinary hobby servo cannot report anything at all. This phase is a bonus; December does not
      depend on it.
    items:
      - part: Servo with position feedback
        qty: 2
        why: Pan and tilt, for a camera head that looks where the car is about to go.
        spec: A serial-bus servo that reports its position. Two, for two axes.
        state: needed
        options:
          - name: ROBOTIS Dynamixel XL330-M288-T
            price: $23.90-27.49
            url: https://www.robotis.us/dynamixel-xl330-m288-t/
            note: Reports position, speed, current and temperature - exactly what the observation needs.
          - name: Feetech STS3215 serial bus servo
            price: $29-39
            url: https://www.amazon.com/RCmall-Continuous-Programmable-SO-ARM100-Controller/dp/B0F87XY6F2
            note: Magnetic encoder, the same idea, and a good deal more torque.

# Rendered under "Already covered". Listed so nobody spends money on our behalf unnecessarily.
covered:
  - part: 3D printing and filament
    note: A team member owns a printer. Brackets, mounts and the sensor ring are made in-house.
  - part: A phone
    note: >-
      The current build uses a phone we already own as the camera. Either it stays, or a depth
      camera above replaces it. Neither path needs a donated phone.
  - part: Training hardware and software
    note: >-
      The simulator, the training runs and this website all run on a workstation we already have.
      Every line of the software is written and public.
  - part: Wiring, connectors and fasteners
    note: Cheap, and much easier for us to pick up locally than for anyone to package and ship.

# What we can actually offer. Promise nothing that is not in our control.
sponsor_gets:
  - >-
    Your name and logo on this page, and on the finished project's GitHub repository once the car
    is built - so your logo does not end its life on a page asking for parts. The repository is
    the one that lasts; this page comes down when the build is done.
  - Your name and logo on the project poster and in the final written report.
  - A credit in the demo video itself, which is the first thing most people see of this project.
  - Photographs of your part on the finished car, and the measured results it produced.
  - >-
    An honest public writeup either way. If a part turns out not to suit our design, we will say
    why, and we will say it about the design rather than about you.
  - >-
    Everything lives in one open-source repository, so the work your part made possible stays
    readable and citable there for as long as the repository is up.
