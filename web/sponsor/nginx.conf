server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers: we sit behind a Cloudflare tunnel, so nginx's own idea of
    # the scheme and host is wrong.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript image/svg+xml text/plain;

    # The demo GIF is the largest thing here and it only changes when the reel is re-recorded.
    location = /demo.gif {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # The page itself is a parts list that changes as sponsors answer. Never cache it.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # One page and one image is the whole site, so anything else is a real 404 rather than
    # the page served under a second URL.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
