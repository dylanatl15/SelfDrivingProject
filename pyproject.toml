[project]
name = "selfdrive"
version = "0.1.0"
description = "Simulator and RL training stack for an Ackermann self-driving toy car"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=2.1",
    "gymnasium>=1.0,<2.0",
    "stable-baselines3>=2.9,<2.10",
    "sb3-contrib>=2.9,<2.10",
    "torch>=2.13,<2.14",  # CPU build - see the note below
    "pyyaml>=6.0",
    "tensorboard>=2.18",
    "pygame>=2.6",
    "imageio>=2.36",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.7",  # torch.onnx's dynamo exporter imports it
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selfdrive"]

# Deliberately the CPU build of torch, on a box that has an RTX 3080.
#
# The Phase 1 policy is an MLP over 68 floats (~85k parameters). Per-batch kernel launch
# overhead on a net that small outweighs anything CUDA buys back, and PPO throughput here
# is bound by env stepping across 20 CPU workers, not by the network - the GPU measured
# under 5% utilisation during planning. The CPU wheel is also ~200 MB against ~3.5 GB for
# cu130 plus its NVIDIA dependencies.
#
# Note the wheel is manylinux_2_28_x86_64, not linux_x86_64. Fetching it by hand
# (see docs/setup-notes.md) needs the right filename or the CDN returns 403.
#
# To switch to CUDA - worth it only if Phase 3 puts a CNN on raw depth images - set the
# index name to "pytorch-cu130" and the URL to https://download.pytorch.org/whl/cu130,
# then re-run `uv sync`. This box's driver (581.29 / CUDA 13.0) supports cu130. The cu128
# index is no longer maintained for current stable torch.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
